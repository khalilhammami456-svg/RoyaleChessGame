<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATAST Chess Royale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/atast-badge.png">
</head>
<body>
    <div class="atast-grain"></div>
    <svg class="atast-ribbons ribbons-hero" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" fill="none" aria-hidden="true">
      <g class="ribbon-tl">
        <path d="M-60 150 C 120 150, 250 120, 330 20 C 380 -40, 390 -80, 380 -120" stroke="currentColor" stroke-width="44" stroke-linecap="round"/>
        <path d="M-60 390 C 160 380, 300 330, 420 250 C 540 170, 560 60, 520 -40 C 500 -90, 480 -120, 470 -150" stroke="currentColor" stroke-width="44" stroke-linecap="round"/>
      </g>
      <g class="ribbon-br">
        <path d="M1680 560 C 1500 560, 1340 610, 1250 720 C 1190 800, 1180 880, 1200 1000" stroke="currentColor" stroke-width="44" stroke-linecap="round"/>
        <path d="M1680 790 C 1560 780, 1470 810, 1420 880 C 1400 910, 1395 950, 1400 1000" stroke="currentColor" stroke-width="44" stroke-linecap="round"/>
      </g>
    </svg>

    <main class="mode-select-page">
        <div class="mode-select-shell">
            <div class="atast-header" style="flex-direction: row; justify-content: center;">
                <div style="text-align: right;">
                    <div class="atast-tagline" style="letter-spacing: 2px;">ATAST Student Section</div>
                </div>
                <span class="brand-mark" style="width:52px;height:52px;">
                    <img src="assets/atast-club.png" alt="ATAST Club">
                </span>
            </div>

            <div class="hero-title-wrap">
                <h1 class="display-title hero-title">Chess<br>Royale</h1>
                <div class="hero-chip-wrap">
                    <div class="orbit-rings orbit-rings-hero">
                        <svg viewBox="0 0 400 400" class="ring-outer">
                            <ellipse cx="200" cy="200" rx="190" ry="70" fill="none" stroke="#F5921E" stroke-width="7" transform="rotate(-24 200 200)"/>
                            <circle cx="30" cy="265" r="9" fill="#F5921E" transform="rotate(-24 200 200)"/>
                        </svg>
                        <svg viewBox="0 0 400 400" class="ring-inner">
                            <ellipse cx="200" cy="200" rx="180" ry="62" fill="none" stroke="#F5921E" stroke-width="5" transform="rotate(32 200 200)"/>
                        </svg>
                    </div>
                    <span class="hero-chip">Event Edition</span>
                </div>
            </div>

            <div class="page-title">
                <span class="title-badge">♟</span>
                <h1>Choose Your Match</h1>
            </div>

            <div class="container">
                <div class="option-card white-card">
                    <h1>Two Players</h1>
                    <span class="player-icon" data-player-color="white">&#9812;</span>
                    <button class="choose-color-btn" type="button" data-game-mode="two-player" data-player-color="white">Choose</button>
                </div>
                <div class="option-card white-card">
                    <h1>Play vs Computer</h1>
                    <span class="player-icon" data-player-color="white">&#9812;</span>
                    <button class="choose-color-btn" type="button" data-game-mode="computer" data-player-color="white">Play as White</button>
                </div>
                <div class="option-card black-card">
                    <h1>Play vs Computer</h1>
                    <span class="player-icon" data-player-color="black">&#9818;</span>
                    <button class="choose-color-btn" type="button" data-game-mode="computer" data-player-color="black">Play as Black</button>
                </div>
            </div>
        </div>
    </main>

    <script>
      const savedTheme = localStorage.getItem('chess-theme') || 'atast';
      if (savedTheme !== 'classic') document.body.setAttribute('data-theme', savedTheme);

      document.addEventListener('DOMContentLoaded', () => {
        const buttons = document.querySelectorAll('.choose-color-btn');

        buttons.forEach((button) => {
          const icon = button.parentElement.querySelector('.player-icon');
          const playerColor = button.dataset.playerColor || 'white';
          icon.innerHTML = playerColor === 'white' ? '&#9812;' : '&#9818;';

          button.addEventListener('click', () => {
            localStorage.setItem('chess-game-mode', button.dataset.gameMode || 'two-player');
            localStorage.setItem('chess-player-color', playerColor);
            window.location.href = 'game.html';
          });
        });
      });
    </script>
</body>
</html>
